name: Clean Windows build

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'CUDA capability; released GPU coverage is currently 8.9 only'
        type: string
        default: '8.9'
        required: true
      msvc_toolset:
        description: 'Installed VS 2022 toolset; frozen local build uses 14.44'
        type: string
        default: '14.44'
        required: true

permissions:
  contents: read

concurrency:
  group: clean-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-runtime:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CUDA_VISIBLE_DEVICES: ''
      BUILD_ARCHITECTURE: ${{ inputs.architecture }}
      BUILD_MSVC_TOOLSET: ${{ inputs.msvc_toolset }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Source bootstrap contracts without runtime imports
        run: python -I -B -m unittest discover -s tests/build_scripts -v
      - name: Identify this fresh runner and the required compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio 2022 C++ build tools are required' }
          $vcvars = Join-Path $vs 'VC/Auxiliary/Build/vcvarsall.bat'
          if (-not (Test-Path -LiteralPath $vcvars)) { throw 'vcvarsall.bat is missing' }
          $toolsets = Get-ChildItem -LiteralPath (Join-Path $vs 'VC/Tools/MSVC') -Directory
          if (-not @($toolsets | Where-Object Name -Like "$env:BUILD_MSVC_TOOLSET.*").Count) {
            throw "Required MSVC $env:BUILD_MSVC_TOOLSET is absent; installed: $($toolsets.Name -join ', '). No compiler upgrade is substituted."
          }
          "GSSTUDIO_CLEAN_VCVARS=$vcvars" >> $env:GITHUB_ENV
          "GSSTUDIO_CLEAN_WORKSPACE=$env:RUNNER_TEMP/gsstudio-public-source-build" >> $env:GITHUB_ENV
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
          & git --version
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Free, Used
      - name: Build the exact public inputs with isolated CUDA 12.9.0
        shell: pwsh
        run: |
          python -I -B -X utf8 scripts/runtime/bootstrap_windows.py full --workspace "$env:GSSTUDIO_CLEAN_WORKSPACE" --vcvars "$env:GSSTUDIO_CLEAN_VCVARS" --vcvars-version "$env:BUILD_MSVC_TOOLSET" --download-cuda --architecture "$env:BUILD_ARCHITECTURE" --jobs 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record the actual verification scope
        if: always()
        shell: pwsh
        run: |
          $verified = Join-Path $env:GSSTUDIO_CLEAN_WORKSPACE 'verified.json'
          if (Test-Path -LiteralPath $verified) { Get-Content -LiteralPath $verified >> $env:GITHUB_STEP_SUMMARY }
          'This job has no NVIDIA GPU: it checks compilation and offline precompiled imports only. Local GPU, final directory package and third-party distribution approval remain separate gates. No binaries or build archives are uploaded.' >> $env:GITHUB_STEP_SUMMARY
          $logs = Join-Path $env:GSSTUDIO_CLEAN_WORKSPACE 'logs'
          if (Test-Path -LiteralPath $logs) {
            Get-ChildItem -LiteralPath $logs -File | ForEach-Object {
              Write-Output "Log: $($_.Name)"
              Get-Content -LiteralPath $_.FullName -Tail 50
            }
          }
          $builds = Join-Path $env:GSSTUDIO_CLEAN_WORKSPACE 'builds'
          if (Test-Path -LiteralPath $builds) {
            Get-ChildItem -LiteralPath $builds -Recurse -Filter build.log | ForEach-Object {
              Write-Output "Compiler log: $($_.Directory.Name)"
              Get-Content -LiteralPath $_.FullName -Tail 60
            }
          }

  desktop:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: ''
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: '1.95.0'
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked source dependencies
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --ignore-scripts
      - name: Frontend and Rust contracts
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml -- --skip actual_worker_bootstrap_consumes_module_paths_before_argparse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile the Windows desktop executable without an installer upload
        run: npm run tauri -- build --no-bundle
