name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-cpu:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Source syntax, archive manifest and local documentation links
        run: python .github/check_source.py
      - name: Source-only payloads across reachable history (no LFS download)
        run: python -I -B scripts/check_source_payload.py history --all
      - name: Source publication guard regressions (stdlib only)
        run: python -I -B -m unittest discover -s tests/source_guard -v
      - name: Whitespace
        run: git diff --check
      - name: Install CPU test harness only
        run: python -m pip install -r .github/requirements-cpu.txt
      - name: Atomic JSON CPU contracts (no app or Torch installation)
        run: python -B -m pytest -c engine/pytest.ini engine/tests/test_live_json_io.py -ra

  frontend-and-rust:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ''
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Frontend contracts
        run: npm test
      - name: TypeScript, notices and Vite build
        run: npm run build
      - name: Rust unit contracts (runtime startup is a separate local gate)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --skip actual_worker_bootstrap_consumes_module_paths_before_argparse
