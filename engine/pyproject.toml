[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-postshot-engine"
version = "0.1.0"
description = "Independent COLMAP and gsplat desktop engine"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "Pillow", "plyfile"]

[project.scripts]
local-postshot = "local_postshot.worker:main"

[tool.setuptools.packages.find]
where = ["."]
